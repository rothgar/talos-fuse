name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E – local Docker cluster
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Enable FUSE
        run: |
          sudo apt-get install -y fuse3
          sudo modprobe fuse
          ls -l /dev/fuse

      - name: Install talosctl
        run: |
          curl -sL https://talos.dev/install | sh
          talosctl version --client

      - name: Run e2e tests
        run: go test -tags e2e -v -timeout 15m ./e2e/...
